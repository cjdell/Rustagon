[package]
name    = "app"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = []
http-server = ["dep:picoserve"]
embassy = ["http-server", "picoserve/embassy"]
std = []
tokio = ["http-server", "picoserve/tokio", "std", "embassy-time/std"]
extern-alloc = ["dep:esp-alloc"]
web-bundle = []
wasm-runtime = ["dep:wasmi", "dep:wasmi_core"]
# Headless test support: enables the embassy-time mock driver so tests can
# advance the clock deterministically, plus the `app::testing` module
# (MockPlatform). Never enabled in production (firmware/desktop) builds.
testing = ["embassy-time/mock-driver", "embassy-time/generic-queue-32"]

[dependencies]
display_types = { path = "../libs/display_types" }
embedded-tools = { path = "../libs/embedded_tools" }
wasm_protocol = { path = "../libs/wasm_protocol" }

embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
embassy-time = "0.5.1"

embedded-hal = "1.0"
embedded-graphics = "0.8.1"

serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.149", default-features = false, features = ["alloc"] }
log = "0.4.29"
critical-section = "1.2.0"
puressh = { version = "0.1.3", default-features = false, features = ["alloc"] }
purecrypto = { version = "0.6.29", default-features = false }

picoserve = { git = "https://github.com/sammhicks/picoserve.git", features = ["alloc", "ws"], optional = true }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal.git", tag = "esp-hal-v1.1.2", package = "esp-alloc", optional = true, features = ["esp32s3", "nightly"] }
wasmi = { path = "../libs/wasmi/crates/wasmi", default-features = false, optional = true }
wasmi_core = { path = "../libs/wasmi/crates/core", default-features = false, optional = true }

[dev-dependencies]
# Only used by the `ssh` end-to-end test: spins up a real SSH server
# (host-side, std) to drive the no_std `SshSession` engine against.
puressh = { version = "0.1.3", features = ["server"] }
