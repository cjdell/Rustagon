[package]
name    = "firmware"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
cy8cmbr3116 = { path = "../drivers/cy8cmbr3116" }
bq25895 = { path = "../drivers/bq25895" }
app = { path = "../app", features = ["http-server", "embassy", "extern-alloc", "web-bundle", "wasm-runtime"] }
wasm_protocol = { path = "../libs/wasm_protocol" }
display_renderer = { path = "../libs/display_renderer" }
display_types = { path = "../libs/display_types" }
embedded-tools = { path = "../libs/embedded_tools" }
esp32s3-embedded-tools = { path = "../libs/esp32s3_embedded_tools" }

esp-backtrace = { git = "https://github.com/esp-rs/esp-hal.git", tag = "esp-hal-v1.1.2", package = "esp-backtrace", features = [
    "panic-handler",
    "esp32s3",
    "println"
] }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal.git", tag = "esp-hal-v1.1.2", package = "esp-bootloader-esp-idf", features = ["esp32s3"] }
esp-hal = { git = "https://github.com/esp-rs/esp-hal.git", tag = "esp-hal-v1.1.2", package = "esp-hal", features = ["log-04", "unstable", "esp32s3"] }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal.git", tag = "esp-hal-v1.1.2", package = "esp-rtos", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }
esp-println = { git = "https://github.com/esp-rs/esp-hal.git", tag = "esp-hal-v1.1.2", package = "esp-println", features = ["esp32s3", "log-04"] }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal.git", tag = "esp-hal-v1.1.2", package = "esp-alloc", features = ["esp32s3", "nightly"] }
esp-radio = { git = "https://github.com/esp-rs/esp-hal.git", tag = "esp-hal-v1.1.2", package = "esp-radio", features = [
  "esp-alloc",
  "esp32s3",
  "log-04",
  "unstable",
  "wifi",
] }
esp-storage = { git = "https://github.com/esp-rs/esp-hal.git", tag = "esp-hal-v1.1.2", package = "esp-storage", features = ["esp32s3"] }

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = "0.5.1"
embassy-net = { version = "0.9.1", features = ["dhcpv4", "medium-ethernet", "medium-ip", "tcp", "udp", "dhcpv4-hostname", "dns", "multicast"] }
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
embassy-embedded-hal = "0.6.0"

embedded-nal-async = "0.9.0"
embedded-storage = "0.3.1"
embedded-io = { version = "0.7.1", features = ["alloc"] }
embedded-io-async = { version = "0.7.0", features = ["alloc"] }
embedded-graphics = "0.8.1"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"

edge-dhcp = "0.8.0"
edge-mdns = { version = "0.8.0", features = ["log"] }
edge-nal = "0.7.0"
edge-nal-embassy = { version = "0.9.0", default-features = false, features = ["dhcpv4", "dhcpv4-hostname", "dns", "multicast", "proto-ipv4", "tcp", "udp", "medium-ethernet", "medium-ip"] }

wasmi = { path = "../libs/wasmi/crates/wasmi", default-features = false }
wasmi_core = { path = "../libs/wasmi/crates/core", default-features = false, features = ["psram-alloc"] }

serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.149", default-features = false, features = ["alloc"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }

static_cell = "2.1.1"
bytes = { version = "1.11.0", default-features = false }
zerocopy = { version = "0.8.33", default-features = false }
smoltcp = { version = "0.13.1", default-features = false, features = ["medium-ethernet", "multicast", "proto-dhcpv4", "proto-dns", "proto-ipv4", "socket-dns", "socket-icmp", "socket-raw", "socket-tcp", "socket-udp"] }
reqwless = { version = "0.14.0", default-features = false, features = ["alloc"] }
picoserve = { git = "https://github.com/sammhicks/picoserve.git", features = ["alloc", "embassy", "ws"] }
fatfs = { version = "0.4.0", default-features = false, features = ["alloc"], git = "https://github.com/rafalh/rust-fatfs" }
log = "0.4.29"
procmacros = { path = "../libs/procmacros" }
gc9a01-rs = "0.4.2"
display-interface = "0.5.0"
aw9523b = "0.1.0"
tca8418 = "0.2.2"
display-interface-spi = "0.5.0"
critical-section = "1.2.0"
edge-captive = "0.8.0"
micromath = "2.1.0"
crc = "3.4.0"

[dev-dependencies]
embedded-test = { version = "0.7.2", features = [
    "xtensa-semihosting",
    "embassy",
    "external-executor"
] }

# [profile.release]
# codegen-units    = 1     # LLVM can perform better optimizations using a single thread
# debug            = 2
# debug-assertions = false
# incremental      = false
# lto              = 'fat'
# opt-level        = 's'
# overflow-checks  = false
