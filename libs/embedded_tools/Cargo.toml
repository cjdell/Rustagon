[package]
name = "embedded-tools"
version = "0.1.0"
edition = "2024"
authors = ["Chris Dell <cjdell@gmail.com>"]
description = "Useful tools for embedded firmware"

[dependencies]
log = "0.4.22"
defmt = { version = "1.1.0", optional = true }
littlefs-rust = "0.1.0"
block_device = "0.1.3"

serde = { version = "1.0.228", default-features = false, features = [
    "alloc",
    "derive",
] }
serde_json = { version = "1.0.150", default-features = false, features = [
    "alloc",
] }

embedded-io-async = "0.7.0"

embassy-futures = { version = "0.1.2" }
embassy-time = { version = "0.5.1" }
embassy-net = { version = "0.9.1", features = [
    "icmp",
    "tcp",
    "udp",
    "raw",
    "dhcpv4",
    "medium-ethernet",
    "dns",
] }
embassy-sync = { version = "0.8.0" }
